[package]
name = "kawaks-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
r68k = "0.2.2"
z80emu = { version = "0.11.0", default-features = false }
crc32fast = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
zip = { version = "4", default-features = false, features = ["deflate"] }
sdl2 = { version = "0.38.0", features = ["bundled", "static-link"], optional = true }
emu198x-yamaha-ym2610 = "=0.1.0"
font8x8 = { version = "0.3", optional = true }
tinyfiledialogs = { version = "3", optional = true }

[features]
sdl2 = ["dep:sdl2", "dep:font8x8", "dep:tinyfiledialogs"]
